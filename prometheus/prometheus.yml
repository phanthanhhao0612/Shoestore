global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Giám sát ứng dụng .NET
  - job_name: 'dotnet-app'
    static_configs:
      - targets: ['shoestore-app:5000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Giám sát database
  - job_name: 'sqlserver'
    static_configs:
      - targets: ['sqlserver:1433']
    metrics_path: '/metrics'
    scrape_interval: 30s 