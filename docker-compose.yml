version: '3.8'

services:
  # Shoestore Web Application
  shoestore-web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "91:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=shoestore-db;Database=Shoestore1111;User Id=sa;Password=t123456;TrustServerCertificate=true
    depends_on:
      - shoestore-db
    networks:
      - shoestore-network
    restart: unless-stopped

  # SQL Server Database
  shoestore-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=t123456
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - shoestore-db-data:/var/opt/mssql
    networks:
      - shoestore-network
    restart: unless-stopped

  # Redis Cache (Optional)
  shoestore-redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - shoestore-redis-data:/data
    networks:
      - shoestore-network
    restart: unless-stopped

volumes:
  shoestore-db-data:
    driver: local
  shoestore-redis-data:
    driver: local

networks:
  shoestore-network:
    driver: bridge 